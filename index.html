<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>

    /* ══════════════════════════════════════
       ROOT & RESET
    ═══════════════════════════════════════ */
    :root {
      --primary: #0f3460;
      --accent: #e94560;
      --bg: #07071a;
      --glass: rgba(255, 255, 255, 0.04);
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── AMBIENT BACKGROUND ── */
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(233,69,96,0.15), transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }
    body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(15,52,96,0.3), transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }

    /* ── STARFIELD ── */
    .stars-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: starTwinkle var(--dur) ease-in-out infinite var(--delay); opacity: 0; }
    @keyframes starTwinkle { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 0.8; transform: scale(1.2); } }

    /* ── CONTAINERS ── */
    .container { width: 100%; max-width: 620px; z-index: 1; }
    
    /* Hide Dashboard by default */
    #dashboardView { display: none; }

    /* ── PAGE HEADER ── */
    .page-header { text-align: center; margin-bottom: 32px; position: relative; }
    .page-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #ffd700; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; padding: 6px 18px; border-radius: 50px; margin-bottom: 14px; }
    .page-title { font-size: clamp(24px, 5vw, 36px); font-weight: 900; background: linear-gradient(135deg, #fff, #a8c8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }

    .btn-logout { position: absolute; top: 0; right: 0; background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3); color: #ff4d4d; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-logout:hover { background: #ff4d4d; color: #fff; }

    /* ═══════════════════════════════════════
       GLASS PANELS
    ═══════════════════════════════════════ */
    .glass-panel { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; margin-bottom: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); animation: slideUp 0.5s ease both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .panel-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .panel-icon.lock-icon { background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05)); border: 1px solid rgba(255,215,0,0.3); }
    .panel-title { font-size: 17px; font-weight: 800; color: #fff; }
    .panel-sub { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 2px; }

    /* ═══════════════════════════════════════
       FORM INPUTS
    ═══════════════════════════════════════ */
    .input-group { margin-bottom: 14px; position: relative; }
    .input-label { display: block; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 7px; padding-left: 4px; }
    .form-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 15px 18px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
    .form-input:focus { border-color: rgba(233,69,96,0.6); background: rgba(233,69,96,0.04); box-shadow: 0 0 0 4px rgba(233,69,96,0.08); }

    .btn-submit { width: 100%; background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; border: none; border-radius: 14px; padding: 17px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 6px; box-shadow: 0 8px 24px rgba(233,69,96,0.35); }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(233,69,96,0.5); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── GALLERY UI ── */
    .upload-box { border: 2px dashed rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); border-radius: 14px; padding: 30px 20px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .upload-box:hover { border-color: rgba(233,69,96,0.5); background: rgba(233,69,96,0.05); }
    .upload-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 2; }
    .change-img-btn { position: absolute; bottom: 8px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 4px 10px; border-radius: 50px; z-index: 3; display: none; pointer-events: none; }

    /* ── INVENTORY ── */
    .product-row { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); padding: 12px 14px; border-radius: 16px; margin-bottom: 10px; transition: 0.3s; }
    .product-row:hover { background: rgba(255,255,255,0.06); transform: translateX(3px); }
    .prod-thumb-wrap { width: 60px; height: 60px; border-radius: 13px; overflow: hidden; background: rgba(255,255,255,0.1); }
    .prod-thumb { width: 100%; height: 100%; object-fit: cover; }
    .prod-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .prod-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prod-price { font-size: 14px; font-weight: 800; color: #e94560; }
    .btn-delete { background: rgba(255,77,77,0.1); color: #ff4d4d; border: 1px solid rgba(255,77,77,0.2); padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-delete:hover { background: #e94560; color: #fff; border-color: transparent; }

  </style>
</head>
<body>

<div class="stars-wrap" id="starsWrap"></div>

<!-- ═══════════════════════════════════════
   LOGIN VIEW (Gatekeeper)
═══════════════════════════════════════ -->
<div class="container" id="loginView">
  <div class="page-header">
    <div class="page-badge">🔒 &nbsp;Secure Access</div>
    <h1 class="page-title">Admin Login</h1>
  </div>

  <div class="glass-panel">
    <div class="panel-header">
      <div class="panel-icon lock-icon">🗝️</div>
      <div>
        <div class="panel-title">Authentication Required</div>
        <div class="panel-sub">Enter your credentials to manage store</div>
      </div>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label class="input-label">Shop ID</label>
        <input type="text" id="loginId" class="form-input" placeholder="Enter Shop ID" required>
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input type="password" id="loginPwd" class="form-input" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn-submit">Unlock Terminal</button>
    </form>
  </div>
</div>


<!-- ═══════════════════════════════════════
   DASHBOARD VIEW (Hidden until Login)
═══════════════════════════════════════ -->
<div class="container" id="dashboardView">
  
  <div class="page-header">
    <button class="btn-logout" onclick="logout()">Logout</button>
    <div class="page-badge">⚙️ &nbsp;Admin Panel</div>
    <h1 class="page-title">Product Dashboard</h1>
  </div>

  <!-- ADD PRODUCT -->
  <div class="glass-panel">
    <form id="productForm">
      <input type="hidden" name="image" id="finalImageUrl">
      
      <div class="input-group">
        <label class="input-label">Product Image</label>
        <label class="upload-box">
          <input type="file" id="imageInput" accept="image/*" style="display:none;">
          <div style="font-size:32px;">📸</div>
          <div style="font-size:13px; font-weight:600; color:#fff; margin-top:8px;">Tap to select from Gallery</div>
          <img id="localPreview" class="upload-preview" src="">
          <div id="changeText" class="change-img-btn">Tap to change</div>
        </label>
      </div>

      <div class="input-group"><label class="input-label">Product Name</label>
        <input type="text" name="name" class="form-input" required></div>
      
      <div class="input-group"><label class="input-label">Description</label>
        <input type="text" name="description" class="form-input" required></div>
      
      <div class="input-group"><label class="input-label">Category</label>
        <input type="text" name="category" class="form-input"></div>
      
      <div class="input-group"><label class="input-label">Price</label>
        <div class="price-wrap"><span class="price-symbol">₹</span>
        <input type="number" name="price" class="form-input" style="padding-left:36px;" required></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">🚀 &nbsp;Deploy Product</button>
    </form>
  </div>

  <!-- INVENTORY -->
  <div class="glass-panel">
    <div class="panel-header">
      <div style="font-size:17px; font-weight:800; color:#fff;">📦 Inventory</div>
    </div>
    <div id="adminProducts" style="text-align:center; color:rgba(255,255,255,0.5);">
      ⏳ Waiting for authentication...
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════
   1. CREDENTIALS & API SETUP (CHANGE THESE)
════════════════════════════════════════ */
// ---> CHANGE YOUR LOGIN DETAILS HERE <---
const ADMIN_ID = "akshat";    
const ADMIN_PWD = "05122007";

// ---> CHANGE YOUR APIS HERE <---
const adminUrl = "https://script.google.com/macros/s/AKfycbywUwcl7CPB_e4LgTg23lAdZmkydLJ03KKYOXGiYeMpXNuHV1p3OpJNgd6ZrdaIxdceRA/exec";
const CLOUD_NAME = "dxm39ikfd"; 
const UPLOAD_PRESET = "parashoqr_preset"; 
const cloudinaryUrl = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;


/* ════════════════════════════════════════
   2. LOGIN GATEKEEPER
════════════════════════════════════════ */
// Check if already logged in this session
if(sessionStorage.getItem("isLoggedIn") === "true") {
  showDashboard();
}

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const id = document.getElementById("loginId").value;
  const pwd = document.getElementById("loginPwd").value;

  if(id === ADMIN_ID && pwd === ADMIN_PWD) {
    sessionStorage.setItem("isLoggedIn", "true");
    showDashboard();
  } else {
    alert("❌ Access Denied: Incorrect ID or Password");
  }
});

function showDashboard() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";
  fetchAdminProducts(); // Only fetch data AFTER successful login!
}

function logout() {
  sessionStorage.removeItem("isLoggedIn");
  location.reload(); // Refresh page to lock it again
}


/* ════════════════════════════════════════
   3. IMAGE UPLOAD PREVIEW
════════════════════════════════════════ */
const imageInput = document.getElementById('imageInput');
const localPreview = document.getElementById('localPreview');
const changeText = document.getElementById('changeText');

imageInput.addEventListener('change', function() {
  const file = this.files[0];
  if(file) {
    localPreview.src = URL.createObjectURL(file);
    localPreview.style.display = 'block';
    changeText.style.display = 'block';
  }
});


/* ════════════════════════════════════════
   4. ADD PRODUCT LOGIC
════════════════════════════════════════ */
document.getElementById("productForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const file = imageInput.files[0];
  const hiddenImageInput = document.getElementById("finalImageUrl");

  btn.disabled = true;

  try {
    if (file) {
      btn.textContent = "☁️ Uploading Image...";
      const formDataCloud = new FormData();
      formDataCloud.append("file", file);
      formDataCloud.append("upload_preset", UPLOAD_PRESET);

      const resCloud = await fetch(cloudinaryUrl, { method: "POST", body: formDataCloud });
      const dataCloud = await resCloud.json();
      
      if (dataCloud.secure_url) hiddenImageInput.value = dataCloud.secure_url;
      else throw new Error("Cloudinary upload failed.");
    } else {
      hiddenImageInput.value = "";
    }

    btn.textContent = "🚀 Saving to Database...";
    const finalFormData = new FormData(this);
    const resGAS = await fetch(adminUrl, { method: "POST", body: finalFormData });
    
    alert("✅ " + await resGAS.text());
    
    this.reset();
    localPreview.style.display = 'none';
    changeText.style.display = 'none';
    hiddenImageInput.value = "";
    
    fetchAdminProducts();
  } catch (err) {
    alert("❌ Error: " + err.message);
  } finally {
    btn.innerHTML = "🚀 &nbsp;Deploy Product";
    btn.disabled = false;
  }
});


/* ════════════════════════════════════════
   5. FETCH & DELETE PRODUCTS
════════════════════════════════════════ */
function fetchAdminProducts(){
  const container = document.getElementById("adminProducts");
  container.innerHTML = `<div style="text-align:center; padding:20px; color:#fff;">⏳ Loading inventory...</div>`;

  fetch(adminUrl).then(res => res.json()).then(data => {
    if(data.length === 0){
      container.innerHTML = `<div style="text-align:center; color:#aaa; padding:20px;">📭 Inventory is empty</div>`;
      return;
    }

    container.innerHTML = "";
    const frag = document.createDocumentFragment();

    data.forEach((p, index) => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <div class="prod-thumb-wrap">
          ${p.image ? `<img class="prod-thumb" src="${p.image}">` : `<div style="text-align:center; padding-top:15px; font-size:24px;">🛍️</div>`}
        </div>
        <div class="prod-info">
          <span class="prod-name">${p.name}</span>
          <span class="prod-price">₹${p.price}</span>
        </div>
        <button class="btn-delete" onclick="deleteProduct(${index + 2})">🗑 Delete</button>
      `;
      frag.appendChild(row);
    });
    container.appendChild(frag);
  });
}

function deleteProduct(row){
  if(!confirm("⚠️ Delete this product?")) return;
  fetch(`${adminUrl}?deleteRow=${row}`).then(res => res.text()).then(msg => {
    alert("🗑️ " + msg);
    fetchAdminProducts();
  });
}

/* Starfield Setup */
const wrap = document.getElementById('starsWrap');
for(let i=0; i<100; i++){
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%; top:${Math.random()*100}%; width:2px; height:2px; --dur:${2+Math.random()*4}s; --delay:-${Math.random()*5}s; --bright:0.8;`;
  wrap.appendChild(s);
}
</script>
</body>
</html>
